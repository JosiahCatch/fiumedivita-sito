<style>
  /* Layout: lista a una colonna pensata per il pollice; ogni post è una riga con data, titolo e due spunte grandi. Palette del sito Fiume di Vita. */
  :root {

    }
  }
  :root[data-theme="dark"] {
    --paper: #1A1C1F; --sand: #23262A; --sea: #5FB8D3; --sea-soft: #173540; --sun: #E3A55A; --sun-soft: #3A2A16;
    --ink: #E9ECEE; --muted: #A3ADB3; --line: #34383D; --ok: #7FD39C; --ok-soft: #1C3426;
    --warn: #F0937C; --warn-soft: #3B211B; color-scheme: dark;

  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

  .progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--sea-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button, .btn { font: 600 13px var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer; }

  button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .sync { font-size: 12px; color: var(--muted); }
  .sync.off { color: var(--warn); }

  .week { display: grid; gap: 8px; margin-top: 20px; }
  .week h2 { margin: 0; font-family: var(--f-display); font-size: 17px; }
  .week .prep { font-size: 12px; color: var(--sun); font-weight: 600; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  .card.done { background: var(--ok-soft); border-color: transparent; }
  .row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 12px 8px; }
  .date { text-align: center; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .date .dow { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .date .day { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--sea); }
  .date .mon { display: block; font-size: 11px; color: var(--muted); }
  .card.done .date .day { color: var(--ok); }
  .main { min-width: 0; display: grid; gap: 4px; }
  .main h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .card.done h3 { text-decoration: line-through; color: var(--muted); }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--sea-soft); color: var(--sea); }
  .pill.rub { background: var(--sun-soft); color: var(--sun); }
  .pill.pin { background: var(--warn-soft); color: var(--warn); }
  .checks { display: flex; gap: 8px; padding: 0 12px 10px 66px; flex-wrap: wrap; }
  .chk { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; cursor: pointer; user-select: none; }
  .chk input { width: 20px; height: 20px; accent-color: var(--ok); margin: 0; }
  .chk:has(input:checked) { border-color: var(--ok); color: var(--ok); }
  details { border-top: 1px solid var(--line); }
  details summary { cursor: pointer; padding: 8px 12px 8px 66px; font-size: 13px; color: var(--sea); font-weight: 600; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .det { padding: 0 12px 12px 66px; display: grid; gap: 6px; font-size: 14px; }
  .det p { margin: 0; }
  .det b { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; display: block; }
  .hook { font-style: italic; }
  .alert { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; }

  .task { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .task + .task { border-top: 1px solid var(--line); }
  .task input { width: 20px; height: 20px; accent-color: var(--ok); margin: 1px 0 0; flex: none; }
  .task:has(input:checked) span { text-decoration: line-through; color: var(--muted); }
  .stories { font-size: 13px; background: var(--sea-soft); border-radius: 10px; padding: 8px 12px; margin: 0; }
  .stories b { color: var(--sea); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  @media (max-width: 380px) { .checks, details summary, .det { padding-left: 12px; } }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

  { w: 15, p: { id: "s15", dow: "Dom", day: 7, mon: "mar", format: "Reel", rub: "La domenica in 60 secondi",
    title: "Clip della predica",
    hook: "Una frase forte, scritta sui primi 2 secondi.",
    idea: "Verso Pasqua: un passaggio sulla croce o sul perdono.",
    vangelo: "Il pezzo giusto è quello in cui si capisce chi è Gesù e cosa offre.",
    foto: CLIP_FOTO } },
  { w: 16, p: { id: "s16", dow: "Dom", day: 14, mon: "mar", format: "Reel", rub: "Ministeri",
    title: "Gli uomini",
    hook: "Gli uomini non parlano mai di come stanno. Qui sì.",
    idea: "Il gruppo degli uomini: lavoro, famiglia, fatica, fede. Tono diretto. Si lega al calcetto per chi vuole cominciare da lì.",

    vangelo: "Il pezzo giusto è quello in cui si capisce chi è Gesù e cosa offre.",
    foto: CLIP_FOTO } }
];
SUNDAYS.forEach(function (s) { WEEKS[s.w].posts.push(s.p); });

/* Versione da file: le spunte restano salvate nel browser di questo telefono. */
var MONTHS = { nov: 10, dic: 11, gen: 0, feb: 1, mar: 2 };
function postDate(p) { var m = MONTHS[p.mon]; return new Date(m >= 10 ? 2026 : 2027, m, p.day); }
WEEKS.forEach(function (w) { w.posts.sort(function (a, b) { return postDate(a) - postDate(b); }); });

var START = new Date(2026, 10, 16);
var today = new Date(); today.setHours(0, 0, 0, 0);
var nowWeek = Math.floor((today - START) / (7 * 864e5));

var state = {};
var LOCAL = "cal-pozzuoli-check-v1";
var coll = null, filterTodo = true;
try { state = JSON.parse(localStorage.getItem(LOCAL) || "{}") || {}; } catch (e) { state = {}; }
function saveLocal() { try { localStorage.setItem(LOCAL, JSON.stringify(state)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function chk(k, label) {
  return '<label class="chk"><input type="checkbox" id="c-' + k + '" data-k="' + k + '"' + (state[k] ? ' checked' : '') + '>' + label + '</label>';
}

function render() {
  var html = "", shown = 0;
  WEEKS.forEach(function (w, i) {
    var tasks = (w.tasks || []).filter(function (t) { return !filterTodo || !state[t.id]; });
    var posts = w.posts.filter(function (p) { return !filterTodo || !state[p.id + "-pub"]; });
    if (filterTodo && !tasks.length && !posts.length) return;
    shown++;
    html += '<section class="week' + (i === nowWeek ? ' now' : '') + '" id="w' + i + '"><div><h2>' + esc(w.title) + '</h2><span class="prep">' + esc(w.prep || "") + '</span></div>';
    if (tasks.length) {
      html += '<div class="card">';
      tasks.forEach(function (t) {
        html += '<label class="task"><input type="checkbox" id="c-' + t.id + '" data-k="' + t.id + '"' + (state[t.id] ? ' checked' : '') + '><span>' + esc(t.text) + '</span></label>';
      });
      html += '</div>';
    }
    posts.forEach(function (p) {
      var pub = !!state[p.id + "-pub"];
      html += '<article class="card' + (pub ? ' done' : '') + '">' +
        '<div class="row"><div class="date"><span class="dow">' + p.dow + '</span><span class="day">' + p.day + '</span><span class="mon">' + p.mon + '</span></div>' +
        '<div class="main"><h3>' + esc(p.title) + '</h3><div class="pills"><span class="pill">' + esc(p.format) + '</span><span class="pill rub">' + esc(p.rub) + '</span>' + (p.pin ? '<span class="pill pin">Da fissare</span>' : '') + '</div></div></div>' +
        '<div class="checks">' + chk(p.id + "-ready", "Programmato") + chk(p.id + "-pub", "Pubblicato") + '</div>' +
        '<details><summary>Dettagli</summary><div class="det">' +
        '<p class="hook">«' + esc(p.hook) + '»</p>' +
        '<p><b>L\'idea</b>' + esc(p.idea) + '</p><p><b>Gesù</b>' + esc(p.vangelo) + '</p><p><b>Da fotografare</b>' + esc(p.foto) + '</p>' +
        (p.alert ? '<p class="alert">' + esc(p.alert) + '</p>' : '') +
        '</div></details></article>';
    });
    if (w.stories) html += '<p class="stories"><b>Storie:</b> ' + esc(w.stories) + '</p>';
    html += '</section>';
  });
  if (!shown) html = '<p class="empty">Tutto fatto fino a Pasqua. Bravo!</p>';
  document.getElementById("weeks").innerHTML = html;
  updateCount();
}

function updateCount() {
  var tot = 0, done = 0;
  WEEKS.forEach(function (w) { w.posts.forEach(function (p) { tot++; if (state[p.id + "-pub"]) done++; }); });
  document.getElementById("countTot").textContent = tot;
  document.getElementById("countDone").textContent = done;
  document.getElementById("barFill").style.width = (tot ? done / tot * 100 : 0) + "%";
}

function setSync(text, off) { var s = document.getElementById("sync"); s.textContent = text; s.classList.toggle("off", !!off); }

document.getElementById("weeks").addEventListener("change", function (e) {
  var k = e.target.getAttribute("data-k");
  if (!k) return;
  var on = e.target.checked;
  state[k] = on;
  saveLocal();
  updateCount();
  var card = e.target.closest("article.card");
  if (card && /-pub$/.test(k)) card.classList.toggle("done", on);
  if (coll) {
    coll.doc(k).set({ on: on, at: new Date().toISOString() }).catch(function () {
      setSync("Spunta non salvata online: resta su questo dispositivo.", true);
    });
  }
});

function setFilter(todo) {
  filterTodo = todo;
  document.getElementById("fTodo").setAttribute("aria-pressed", String(todo));
  document.getElementById("fAll").setAttribute("aria-pressed", String(!todo));
  render();
}
document.getElementById("fTodo").addEventListener("click", function () { setFilter(true); });
document.getElementById("fAll").addEventListener("click", function () { setFilter(false); });
function goNow() {
  var target = document.getElementById("w" + Math.max(0, nowWeek)) || document.querySelector(".week");
  if (target) target.scrollIntoView({ block: "start" });
}
document.getElementById("goNow").addEventListener("click", goNow);
render();

(function () {
  var ok = false;
  try { localStorage.setItem("cal-test", "1"); ok = localStorage.getItem("cal-test") === "1"; localStorage.removeItem("cal-test"); } catch (e) {}
  setSync(ok ? "Le spunte restano salvate su questo telefono." : "Qui le spunte non si salvano: apri il file con Chrome o Safari.", !ok);
})();
</script>
